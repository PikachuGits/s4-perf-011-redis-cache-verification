services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: clawhunt
      POSTGRES_PASSWORD: clawhunt
      POSTGRES_DB: clawhunt_2984_test
    ports:
      - "55436:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawhunt -d clawhunt_2984_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.8
    ports:
      - "56380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
